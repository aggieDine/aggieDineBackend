AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AggieDine Serverless Service Template

Globals:
  Function:
    Timeout: 900
    MemorySize: 256
    Environment:
      Variables:
        SERVICE_NAME: !Ref ServiceName
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        DYNAMODB_TABLE_NAME: !Ref DynamoDBTable
        S3_BUCKET_NAME: !Ref S3Bucket
        AWS_COGNITO_REGION: !Ref AWS::Region
        AWS_COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        AWS_COGNITO_APP_CLIENT_ID: !Ref CognitoAppClientId
        FIREBASE_CREDENTIALS: '{{resolve:ssm:/my-app/firebase-credentials:1}}'
        WEBSHARE_CREDENTIALS: '{{resolve:ssm:/my-app/webshare-credentials:1}}'
        PROXY_URL: '{{resolve:ssm:/my-app/webshare-proxy-url:1}}'

Parameters:
  ServiceName:
    Type: String
    Default: aggiedine-backend-service
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
  LogLevel:
    Type: String
    Default: info
  CognitoUserPoolId:
    Type: String
    Default: ""
  CognitoAppClientId:
    Type: String
    Default: ""

Resources:
  # --- API Gateway ---
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - "*"

  # --- API Lambda ---
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      Handler: app.handler.handler
      CodeUri: .
      Description: FastAPI application served via Mangum
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBTable
        - S3CrudPolicy:
            BucketName: !Ref S3Bucket

  # --- Menu Scraper Lambda ---
  MenuScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      Handler: scrapers.menu_scraper.handler
      CodeUri: .
      Timeout: 180
      MemorySize: 512
      Description: Scheduled menu scraper
      Layers:
       - arn:aws:lambda:us-east-2:348117807129:layer:curl-cffi:4
      Events:
        ScheduleEvent:
          Type: ScheduleV2
          Properties:
            # "Run at exactly 2:00 AM every day"
            ScheduleExpression: "cron(0 2 * * ? *)"
            # Locks it to Central Time (handles CST/CDT shifts automatically)
            ScheduleExpressionTimezone: "America/Chicago"
            State: ENABLED
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBTable
        - S3CrudPolicy:
            BucketName: !Ref S3Bucket

  # --- Hours Scraper Lambda ---
  HoursScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 2048 
      Timeout: 900
      Events:
        ScheduleEvent:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 2 * * ? *)"
            ScheduleExpressionTimezone: "America/Chicago"
            State: ENABLED
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBTable
        - S3CrudPolicy:
            BucketName: !Ref S3Bucket
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: hours-scraper
      DockerBuildArgs:
        TARGETPLATFORM: "linux/amd64"

  # --- DynamoDB Table ---
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # --- S3 Bucket ---
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  DynamoDBTableName:
    Description: DynamoDB table name
    Value: !Ref DynamoDBTable
  S3BucketName:
    Description: S3 bucket name
    Value: !Ref S3Bucket
